server {
    listen       80;
    server_name  _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve files directly, fall back to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (adjust max-age as needed)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Optional: deny access to dotfiles
    location ~ /\. {
        deny all;
    }
}
