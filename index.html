<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת דוחות מקומית | Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* System Font Stack optimized for Hebrew and Offline usage */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Arial', 'Assistant';
            background-color: #f0f2f5;
            color: #1a202c;
            margin: 0;
            padding: 0;
            user-select: none;
            /* Desktop app feel */
        }

        input,
        button,
        textarea,
        select {
            font-family: inherit !important;
        }

        /* Scrollbar customization - no external assets needed */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .no-select {
            user-select: none;
        }

        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: white;
            }
        }
    </style>
    <script type="importmap">
{

    "react": "https://esm.sh/react@^19.2.3",

    "react/": "https://esm.sh/react@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>

<body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>

</html>
